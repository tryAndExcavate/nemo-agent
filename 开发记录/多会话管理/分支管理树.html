<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>分支全景看板</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --panel: #151b23;
  --panel-2: #1c2430;
  --border: #262f3d;
  --text: #e6edf3;
  --text-dim: #8b96a5;
  --primary: #10b981;
  --primary-dim: #0d9668;
  --accent: #f59e0b;
  --danger: #ef4444;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

#app { display: flex; flex-direction: column; height: 100vh; }

/* ===== 顶部工具条 ===== */
.bm-toolbar {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.bm-title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.bm-toolbar-group { display: flex; align-items: center; gap: 6px; }
.bm-toolbar input[type="text"], .bm-toolbar select {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12.5px;
}
.bm-toolbar input[type="text"] { width: 180px; }
.bm-search-status { font-size: 12px; color: var(--text-dim); min-width: 40px; text-align: center; }
.bm-icon-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 28px; height: 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: .15s;
}
.bm-icon-btn:hover { background: #232c3a; color: var(--text); }
.bm-slider-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
input[type="range"] { width: 110px; accent-color: var(--primary); }
.bm-spacer { flex: 1; }

/* ===== 主体布局 ===== */
.bm-body { flex: 1; display: flex; min-height: 0; }

.bm-tree-wrap {
  flex: 1;
  position: relative;
  min-width: 0;
  background:
    radial-gradient(circle at 20% 10%, #131a24 0, var(--bg) 60%);
  overflow: hidden;
}
.bm-tree-wrap svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.bm-tree-wrap svg:active { cursor: grabbing; }

/* 面包屑 */
.bm-breadcrumb {
  position: absolute;
  top: 12px; left: 12px;
  max-width: calc(100% - 240px);
  background: rgba(21,27,35,.9);
  backdrop-filter: blur(4px);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 12.5px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  z-index: 5;
}
.bm-crumb { color: var(--text-dim); cursor: pointer; padding: 2px 4px; border-radius: 4px; white-space: nowrap; }
.bm-crumb:hover { background: rgba(255,255,255,.06); color: var(--text); }
.bm-crumb.current { color: var(--primary); font-weight: 600; }
.bm-crumb-sep { color: #3a4353; }

/* 迷你地图 */
.bm-minimap-wrap {
  position: absolute;
  top: 12px; right: 12px;
  width: 200px; height: 140px;
  background: rgba(21,27,35,.92);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  z-index: 5;
}
.bm-minimap-wrap svg { width: 100%; height: 100%; cursor: pointer; }

/* 图例 */
.bm-legend {
  position: absolute;
  bottom: 12px; left: 12px;
  background: rgba(21,27,35,.9);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.9;
  z-index: 5;
}
.bm-legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

/* ===== SVG 节点/连线 ===== */
.bm-link { stroke: #303b4a; stroke-width: 1.6; }
.bm-link-main { stroke: var(--primary); stroke-width: 3; }
.bm-link-selected { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 5,3; }

.bm-node { cursor: pointer; }
.bm-circle { transition: r .2s; }
.bm-node:hover .bm-circle { filter: brightness(1.25); }
.bm-select-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.bm-match-ring { fill: none; stroke: #fde047; stroke-width: 2; stroke-dasharray: 3,2; }
.bm-star { fill: #fde047; font-size: 11px; pointer-events: none; }
.bm-label { fill: var(--text); font-size: 11px; pointer-events: none; }
.bm-badge { fill: #fca5a5; font-size: 10px; font-weight: 700; pointer-events: none; }
.bm-tag-dot { fill: #a78bfa; }
.bm-node.bm-dim .bm-label,
.bm-node.bm-dim .bm-star,
.bm-node.bm-dim .bm-badge { opacity: .2; }

.bm-mini-link { stroke: #3a4353; stroke-width: 1; }
.bm-mini-node { fill: #5b6674; }
.bm-mini-node.current { fill: var(--accent); }
.bm-mini-viewport { fill: rgba(16,185,129,.12); stroke: var(--primary); stroke-width: 1; }

/* ===== 右侧面板 ===== */
.bm-side-panel {
  width: 350px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.bm-tabs {
  display: flex;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.bm-tab-btn {
  flex: 1 1 auto;
  background: none;
  border: none;
  color: var(--text-dim);
  padding: 10px 6px;
  font-size: 12px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: .15s;
  white-space: nowrap;
}
.bm-tab-btn:hover { color: var(--text); background: rgba(255,255,255,.03); }
.bm-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

.bm-tab-panel { display: none; padding: 16px; overflow-y: auto; flex: 1; min-height: 0; }
.bm-tab-panel.active { display: block; }

.bm-empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 30px 10px; }

/* 概览统计卡片 */
.bm-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.bm-stat-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
.bm-stat-num { font-size: 20px; font-weight: 700; color: var(--primary); }
.bm-stat-label { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
.bm-quick-actions { display: flex; gap: 8px; }

.bm-mini-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: .15s;
}
.bm-mini-btn:hover { background: #232c3a; }
.bm-mini-btn.primary { background: var(--primary); border-color: var(--primary); color: #062a1c; font-weight: 600; }
.bm-mini-btn.primary:hover { filter: brightness(1.1); }
.bm-mini-btn.warn { border-color: var(--accent); color: var(--accent); }
.bm-mini-btn.danger { border-color: var(--danger); color: var(--danger); }

/* 排行/时间线 */
.bm-rank-row, .bm-timeline-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px;
  transition: .15s;
}
.bm-rank-row:hover, .bm-timeline-row:hover { background: rgba(255,255,255,.05); }
.bm-rank-idx {
  width: 20px; height: 20px; flex-shrink: 0;
  background: var(--panel-2); border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-dim);
}
.bm-rank-text, .bm-timeline-text { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm-rank-value { color: var(--accent); font-size: 11.5px; flex-shrink: 0; }
.bm-timeline-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.bm-timeline-body { flex: 1; min-width: 0; }
.bm-timeline-time { font-size: 10.5px; color: var(--text-dim); }

/* 工具统计条形图 */
.bm-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; }
.bm-bar-label { width: 90px; flex-shrink: 0; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm-bar-track { flex: 1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.bm-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary-dim), var(--primary)); }
.bm-bar-value { width: 22px; text-align: right; color: var(--text-dim); flex-shrink: 0; }

/* 详情面板 */
.bm-detail-title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.bm-order-num {
  width: 22px; height: 22px; flex-shrink: 0;
  background: var(--panel-2); border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-dim);
}
.bm-badge-active { background: var(--primary); color: #062a1c; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.bm-detail-msg { background: var(--panel-2); border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; line-height: 1.55; }
.bm-detail-msg.small { font-size: 12px; }
.bm-detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.bm-meta-chip { background: rgba(255,255,255,.05); padding: 3px 8px; border-radius: 999px; font-size: 11px; color: var(--text-dim); }
.bm-meta-chip.tool { background: rgba(99,102,241,.15); color: #a5b4fc; }
.bm-detail-ref { font-size: 11.5px; color: var(--text-dim); border-left: 3px solid var(--text-dim); padding: 6px 10px; margin-bottom: 10px; }

.bm-field { margin: 14px 0; }
.bm-field label { display: block; font-size: 11.5px; color: var(--text-dim); margin-bottom: 6px; }
.bm-field input[type="text"] {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border);
  color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 12.5px;
}
.bm-tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.bm-tag-chip { background: rgba(167,139,250,.15); color: #c4b5fd; padding: 3px 8px; border-radius: 999px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
.bm-tag-remove { background: none; border: none; color: #c4b5fd; cursor: pointer; font-size: 12px; }
.bm-detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* 对比面板 */
.bm-compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bm-compare-col { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-height: 160px; }
.bm-compare-empty { display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-dim); font-size: 12px; grid-column: span 1; }
.bm-compare-label { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 8px; }

/* 标签总览 */
.bm-tag-group { margin-bottom: 16px; }
.bm-tag-group-title { font-size: 12.5px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
.bm-tag-group-list { display: flex; flex-wrap: wrap; gap: 6px; }
.bm-tag-node-chip { background: var(--panel-2); border: 1px solid var(--border); padding: 4px 9px; border-radius: 999px; font-size: 11px; cursor: pointer; transition: .15s; }
.bm-tag-node-chip:hover { border-color: var(--primary); color: var(--primary); }
</style>
</head>
<body>

<div id="app">
  <!-- ===== 顶部工具条 ===== -->
  <div class="bm-toolbar">
    <div class="bm-title">🗺️ 分支全景看板</div>

    <div class="bm-toolbar-group">
      <input type="text" id="bmSearchInput" placeholder="搜索问题/回答关键词...">
      <button class="bm-icon-btn" id="bmPrevMatch" title="上一个匹配">◀</button>
      <span class="bm-search-status" id="bmSearchStatus"></span>
      <button class="bm-icon-btn" id="bmNextMatch" title="下一个匹配">▶</button>
    </div>

    <div class="bm-toolbar-group">
      <select id="bmToolFilter"><option value="all">全部工具</option></select>
    </div>

    <div class="bm-toolbar-group">
      <span class="bm-slider-label">最小 Token</span>
      <input type="range" id="bmTokenSlider" min="0" max="200" value="0" step="5">
      <span class="bm-slider-label" id="bmTokenSliderLabel">0</span>
    </div>

    <div class="bm-spacer"></div>

    <div class="bm-toolbar-group">
      <button class="bm-icon-btn" id="bmZoomOut" title="缩小">－</button>
      <button class="bm-icon-btn" id="bmZoomIn" title="放大">＋</button>
      <button class="bm-icon-btn" id="bmZoomReset" title="重置视图">⟲</button>
    </div>
    <button class="bm-mini-btn" id="bmToolbarExportBtn">导出当前路径</button>
  </div>

  <!-- ===== 主体 ===== -->
  <div class="bm-body">
    <div class="bm-tree-wrap" id="bmTreeWrap" tabindex="0">
      <svg id="bmSvg">
        <rect id="bmBgRect" x="0" y="0" width="100%" height="100%" fill="transparent"></rect>
        <g id="bmViewport"></g>
      </svg>

      <div class="bm-breadcrumb" id="bmBreadcrumb"></div>

      <div class="bm-minimap-wrap">
        <svg id="bmMiniSvg" viewBox="0 0 200 140"></svg>
      </div>

      <div class="bm-legend">
        <div><span class="bm-legend-dot" style="background:#10b981"></span>颜色 = 层级深度</div>
        <div><span class="bm-legend-dot" style="background:#818cf8;border:1px dashed #818cf8;background:transparent"></span>虚线描边 = 调用了工具</div>
        <div>圆圈大小 = Token 消耗　★ = 主线节点</div>
        <div>数字徽章 = 已折叠的子孙节点数</div>
        <div>拖拽平移 · 滚轮缩放 · 双击空白重置</div>
      </div>
    </div>

    <!-- ===== 右侧信息面板 ===== -->
    <div class="bm-side-panel">
      <div class="bm-tabs">
        <button class="bm-tab-btn active" data-tab="overview">概览</button>
        <button class="bm-tab-btn" data-tab="detail">详情</button>
        <button class="bm-tab-btn" data-tab="ranking">排行</button>
        <button class="bm-tab-btn" data-tab="tools">工具</button>
        <button class="bm-tab-btn" data-tab="timeline">时间线</button>
        <button class="bm-tab-btn" data-tab="tags">标签</button>
        <button class="bm-tab-btn" data-tab="compare">对比</button>
      </div>

      <div class="bm-tab-panel active" id="bmTabPanel_overview"></div>
      <div class="bm-tab-panel" id="bmTabPanel_detail"></div>
      <div class="bm-tab-panel" id="bmTabPanel_ranking"></div>
      <div class="bm-tab-panel" id="bmTabPanel_tools"></div>
      <div class="bm-tab-panel" id="bmTabPanel_timeline"></div>
      <div class="bm-tab-panel" id="bmTabPanel_tags"></div>
      <div class="bm-tab-panel" id="bmTabPanel_compare"></div>
    </div>
  </div>
</div>

  { id:20, parent_id:7, branch_order:1, is_active_branch:0,
    question:'标准正交表的结果如何解读？',
    answer:'通过极差分析找出对结果影响最大的因子。',
    tools:null, first_response_time:260, total_response_time:890, token_count:60,
    create_time:'2024-05-02 10:09:30', reference:null },
];

/* =========================================================
   1. 工具函数
   ========================================================= */
function truncate(text, n) { if (!text) return ''; return text.length > n ? text.slice(0, n) + '…' : text; }
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }
function svgEl(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* =========================================================
   2. 构建树 + 扁平列表
   ========================================================= */
function buildTree(recs) {
  const byId = new Map();
  recs.forEach(r => byId.set(r.id, { ...r, children: [] }));
  let root = null;
  byId.forEach(node => {
    if (node.parent_id == null) root = node;
    else {
      const parent = byId.get(node.parent_id);
      if (parent) { node.parentNode = parent; parent.children.push(node); }
    }
  });
  byId.forEach(node => node.children.sort((a, b) => a.branch_order - b.branch_order));
  return { root, byId };
}

function flattenAll(node, depth, arr) {
  node.depth = depth;
  arr.push(node);
  (node.children || []).forEach(c => flattenAll(c, depth + 1, arr));
  return arr;
}

function countDescendants(node) {
  let c = 0;
  (node.children || []).forEach(ch => { c += 1 + countDescendants(ch); });
  return c;
}

const { root, byId } = buildTree(records);
const allNodesFlat = flattenAll(root, 0, []);
allNodesFlat.forEach(n => { n.__descCount = countDescendants(n); });

/* 时间新旧 -> 透明度映射（0.5 旧 ~ 1.0 新） */
const recencyMap = new Map();
(function computeRecency() {
  const sorted = [...allNodesFlat].sort((a, b) => new Date(a.create_time) - new Date(b.create_time));
  const n = sorted.length;
  sorted.forEach((node, i) => {
    const t = n <= 1 ? 1 : i / (n - 1);
    recencyMap.set(node.id, 0.5 + 0.5 * t);
  });
})();

/* =========================================================
   3. 全局状态
   ========================================================= */
const NODE_GAP = 48, LEVEL_GAP = 180, Y_PAD = 40, X_PAD = 60;
let selectedId = root.id;
let collapsedIds = new Set();
let tagsMap = new Map();     // id -> Set<string>
let aliasMap = new Map();    // id -> string
let compareSlots = { A: null, B: null };
let dimSet = new Set();
let matches = [], matchIndex = -1;
let viewport = { x: 0, y: 0, k: 1 };
let lastNodes = [], lastLinks = [];
let miniMapMeta = { scale: 1, offX: 0, offY: 0 };
let isPanning = false, panStart = null;

const DEPTH_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ef4444'];

/* =========================================================
   4. DOM 引用
   ========================================================= */
const svg = document.getElementById('bmSvg');
const bgRect = document.getElementById('bmBgRect');
const viewportG = document.getElementById('bmViewport');
const miniSvg = document.getElementById('bmMiniSvg');
const breadcrumbEl = document.getElementById('bmBreadcrumb');
const treeWrap = document.getElementById('bmTreeWrap');
const searchInput = document.getElementById('bmSearchInput');
const searchStatusEl = document.getElementById('bmSearchStatus');
const toolFilterSelect = document.getElementById('bmToolFilter');
const tokenSlider = document.getElementById('bmTokenSlider');
const tokenSliderLabel = document.getElementById('bmTokenSliderLabel');

/* =========================================================
   5. 布局算法（尊重折叠状态）
   ========================================================= */
function layoutTree() {
  let yCounter = 0;
  const nodes = [], links = [];
  function assign(node, depth) {
    node.depth = depth;
    const collapsed = collapsedIds.has(node.id);
    const hasVisibleChildren = node.children && node.children.length > 0 && !collapsed;
    if (!hasVisibleChildren) {
      node.y = yCounter; yCounter += 1;
    } else {
      node.children.forEach(c => assign(c, depth + 1));
      const ys = node.children.map(c => c.y);
      node.y = (Math.min(...ys) + Math.max(...ys)) / 2;
    }
    node.x = depth * LEVEL_GAP + X_PAD;
    nodes.push(node);
    if (node.parentNode) links.push({ source: node.parentNode, target: node });
  }
  assign(root, 0);
  return { nodes, links };
}
function pxX(n) { return n.x; }
function pxY(n) { return n.y * NODE_GAP + Y_PAD; }

/* =========================================================
   6. 视觉编码辅助函数
   ========================================================= */
function radiusOf(node) { return 11 + Math.min(15, (node.token_count || 40) / 14); }
function depthColor(depth) { return DEPTH_COLORS[depth % DEPTH_COLORS.length]; }
function recencyOpacity(node) { return recencyMap.get(node.id) ?? 1; }

function computeMainPathIds() {
  const ids = new Set(); let cur = root; ids.add(cur.id);
  while (cur.children && cur.children.length) {
    const next = cur.children.find(c => c.is_active_branch) || cur.children[0];
    ids.add(next.id); cur = next;
  }
  return ids;
}
function computeSelectedPathIds() {
  const ids = new Set(); let cur = byId.get(selectedId);
  while (cur) { ids.add(cur.id); cur = cur.parentNode; }
  return ids;
}
let mainPathIds = computeMainPathIds();
let selectedPathIds = computeSelectedPathIds();

/* =========================================================
   7. 绘制：连线 / 节点
   ========================================================= */
function drawLink(link) {
  const s = link.source, t = link.target;
  const x1 = pxX(s), y1 = pxY(s), x2 = pxX(t), y2 = pxY(t);
  const midX = (x1 + x2) / 2;
  const d = `M ${x1},${y1} C ${midX},${y1} ${midX},${y2} ${x2},${y2}`;
  let cls = 'bm-link';
  if (mainPathIds.has(s.id) && mainPathIds.has(t.id)) cls += ' bm-link-main';
  else if (selectedPathIds.has(s.id) && selectedPathIds.has(t.id)) cls += ' bm-link-selected';
  return svgEl('path', { d, class: cls, fill: 'none' });
}

function drawNode(node) {
  const isDim = dimSet.has(node.id);
  const g = svgEl('g', {
    class: 'bm-node' + (isDim ? ' bm-dim' : ''),
    transform: `translate(${pxX(node)},${pxY(node)})`
  });

  if (matches.includes(node)) g.appendChild(svgEl('circle', { r: radiusOf(node) + 7, class: 'bm-match-ring' }));
  if (selectedId === node.id) g.appendChild(svgEl('circle', { r: radiusOf(node) + 4, class: 'bm-select-ring' }));

  const circle = svgEl('circle', {
    r: radiusOf(node),
    class: 'bm-circle',
    fill: depthColor(node.depth),
    'fill-opacity': recencyOpacity(node) * (isDim ? 0.18 : 1),
    stroke: node.tools ? '#818cf8' : 'rgba(255,255,255,.25)',
    'stroke-width': node.tools ? 2.5 : 1.4,
    'stroke-dasharray': node.tools ? '4,2' : 'none',
  });
  g.appendChild(circle);

  if (node.is_active_branch) {
    const star = svgEl('text', { class: 'bm-star', x: 0, y: 4, 'text-anchor': 'middle' });
    star.textContent = '★';
    g.appendChild(star);
  }

  if (tagsMap.has(node.id) && tagsMap.get(node.id).size > 0) {
    g.appendChild(svgEl('circle', { r: 4, cx: radiusOf(node) - 3, cy: -radiusOf(node) + 3, class: 'bm-tag-dot' }));
  }

  if (collapsedIds.has(node.id) && node.__descCount > 0) {
    const badge = svgEl('text', { class: 'bm-badge', x: 0, y: radiusOf(node) + 15, 'text-anchor': 'middle' });
    badge.textContent = '+' + node.__descCount;
    g.appendChild(badge);
  }

  const label = svgEl('text', { class: 'bm-label', x: radiusOf(node) + 7, y: 4 });
  label.textContent = truncate(aliasMap.get(node.id) || node.question, 13);
  g.appendChild(label);

  const titleEl = svgEl('title', {});
  titleEl.textContent = node.question;
  g.appendChild(titleEl);

  g.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node); });
  g.addEventListener('dblclick', (e) => { e.stopPropagation(); toggleCollapse(node); });

  return g;
}

/* =========================================================
   8. 主渲染流程
   ========================================================= */
function renderCanvas() {
  viewportG.innerHTML = '';
  const { nodes, links } = layoutTree();
  lastNodes = nodes; lastLinks = links;
  mainPathIds = computeMainPathIds();
  selectedPathIds = computeSelectedPathIds();
  links.forEach(l => viewportG.appendChild(drawLink(l)));
  nodes.forEach(n => viewportG.appendChild(drawNode(n)));
  renderMinimap(nodes, links);
  const sel = byId.get(selectedId);
  if (sel) renderBreadcrumb(sel);
}

function renderAll() {
  renderCanvas();
  renderSidePanels();
}

/* =========================================================
   9. 面包屑
   ========================================================= */
function renderBreadcrumb(node) {
  const chain = []; let cur = node;
  while (cur) { chain.unshift(cur); cur = cur.parentNode; }
  breadcrumbEl.innerHTML = '';
  chain.forEach((n, i) => {
    const span = document.createElement('span');
    span.className = 'bm-crumb' + (i === chain.length - 1 ? ' current' : '');
    span.textContent = truncate(aliasMap.get(n.id) || n.question, 14);
    span.addEventListener('click', () => selectNode(n));
    breadcrumbEl.appendChild(span);
    if (i < chain.length - 1) {
      const sep = document.createElement('span');
      sep.className = 'bm-crumb-sep'; sep.textContent = '›';
      breadcrumbEl.appendChild(sep);
    }
  });
}

/* =========================================================
   10. 迷你地图
   ========================================================= */
function renderMinimap(nodes, links) {
  miniSvg.innerHTML = '';
  if (!nodes.length) return;
  const xs = nodes.map(pxX), ys = nodes.map(pxY);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const treeW = Math.max(1, maxX - minX), treeH = Math.max(1, maxY - minY);
  const scale = Math.min(200 / (treeW + 80), 140 / (treeH + 80));
  const offX = -minX * scale + 20, offY = -minY * scale + 20;
  miniMapMeta = { scale, offX, offY };

  links.forEach(l => {
    miniSvg.appendChild(svgEl('line', {
      x1: pxX(l.source) * scale + offX, y1: pxY(l.source) * scale + offY,
      x2: pxX(l.target) * scale + offX, y2: pxY(l.target) * scale + offY,
      class: 'bm-mini-link'
    }));
  });
  nodes.forEach(n => {
    miniSvg.appendChild(svgEl('circle', {
      cx: pxX(n) * scale + offX, cy: pxY(n) * scale + offY, r: 3,
      class: 'bm-mini-node' + (n.id === selectedId ? ' current' : '')
    }));
  });

  const rect = svg.getBoundingClientRect();
  const vx0 = -viewport.x / viewport.k, vy0 = -viewport.y / viewport.k;
  const vw = rect.width / viewport.k, vh = rect.height / viewport.k;
  miniSvg.appendChild(svgEl('rect', {
    x: vx0 * scale + offX, y: vy0 * scale + offY,
    width: vw * scale, height: vh * scale,
    class: 'bm-mini-viewport'
  }));
}

miniSvg.addEventListener('click', (e) => {
  const rect = miniSvg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (200 / rect.width);
  const my = (e.clientY - rect.top) * (140 / rect.height);
  const { scale, offX, offY } = miniMapMeta;
  centerOnPoint((mx - offX) / scale, (my - offY) / scale);
});

/* =========================================================
   11. 缩放 / 平移
   ========================================================= */
function applyTransform() {
  viewportG.setAttribute('transform', `translate(${viewport.x},${viewport.y}) scale(${viewport.k})`);
  renderMinimap(lastNodes, lastLinks);
}
function zoomBy(factor, cx, cy) {
  const rect = svg.getBoundingClientRect();
  cx = cx ?? rect.width / 2; cy = cy ?? rect.height / 2;
  const newK = Math.min(2.5, Math.max(0.35, viewport.k * factor));
  viewport.x = cx - (cx - viewport.x) * (newK / viewport.k);
  viewport.y = cy - (cy - viewport.y) * (newK / viewport.k);
  viewport.k = newK;
  applyTransform();
}
function centerOnPoint(tx, ty) {
  const rect = svg.getBoundingClientRect();
  viewport.x = rect.width / 2 - tx * viewport.k;
  viewport.y = rect.height / 2 - ty * viewport.k;
  applyTransform();
}
function centerOnNode(node) { centerOnPoint(pxX(node), pxY(node)); }

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.1 : 0.9, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

bgRect.addEventListener('mousedown', (e) => {
  isPanning = true;
  panStart = { x: e.clientX, y: e.clientY, vx: viewport.x, vy: viewport.y };
});
window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  viewport.x = panStart.vx + (e.clientX - panStart.x);
  viewport.y = panStart.vy + (e.clientY - panStart.y);
  applyTransform();
});
window.addEventListener('mouseup', () => { isPanning = false; });
bgRect.addEventListener('dblclick', () => { viewport = { x: 0, y: 0, k: 1 }; applyTransform(); centerOnNode(byId.get(selectedId) || root); });

document.getElementById('bmZoomIn').addEventListener('click', () => zoomBy(1.2));
document.getElementById('bmZoomOut').addEventListener('click', () => zoomBy(0.8));
document.getElementById('bmZoomReset').addEventListener('click', () => { viewport = { x: 0, y: 0, k: 1 }; applyTransform(); centerOnNode(byId.get(selectedId) || root); });

/* =========================================================
   12. 选中 / 折叠 / 展开
   ========================================================= */
function revealNode(node) { let cur = node.parentNode; while (cur) { collapsedIds.delete(cur.id); cur = cur.parentNode; } }

function selectNode(node) {
  selectedId = node.id;
  revealNode(node);
  renderAll();
  centerOnNode(node);
  switchSideTab('detail');
}
function toggleCollapse(node) {
  if (!node.children || node.children.length === 0) return;
  if (collapsedIds.has(node.id)) collapsedIds.delete(node.id); else collapsedIds.add(node.id);
  renderAll();
}

/* =========================================================
   13. 搜索
   ========================================================= */
function updateSearchStatus() {
  if (!matches.length) { searchStatusEl.textContent = searchInput.value.trim() ? '无匹配' : ''; return; }
  searchStatusEl.textContent = `${matchIndex + 1}/${matches.length}`;
}
searchInput.addEventListener('input', () => {
  const kw = searchInput.value.trim().toLowerCase();
  matches = [];
  if (kw) {
    allNodesFlat.forEach(n => {
      if ((n.question && n.question.toLowerCase().includes(kw)) || (n.answer && n.answer.toLowerCase().includes(kw))) matches.push(n);
    });
  }
  matchIndex = matches.length ? 0 : -1;
  updateSearchStatus();
  if (matches.length) selectNode(matches[0]); else renderAll();
});
document.getElementById('bmNextMatch').addEventListener('click', () => {
  if (!matches.length) return;
  matchIndex = (matchIndex + 1) % matches.length;
  selectNode(matches[matchIndex]); updateSearchStatus();
});
document.getElementById('bmPrevMatch').addEventListener('click', () => {
  if (!matches.length) return;
  matchIndex = (matchIndex - 1 + matches.length) % matches.length;
  selectNode(matches[matchIndex]); updateSearchStatus();
});

/* =========================================================
   14. 过滤（工具 / Token 阈值）
   ========================================================= */
(function initToolFilter() {
  const toolsSet = new Set();
  allNodesFlat.forEach(n => { if (n.tools) toolsSet.add(n.tools); });
  toolsSet.forEach(t => {
    const opt = document.createElement('option'); opt.value = t; opt.textContent = t;
    toolFilterSelect.appendChild(opt);
  });
  const maxTok = Math.max(...allNodesFlat.map(n => n.token_count || 0));
  tokenSlider.max = String(Math.ceil(maxTok / 10) * 10);
})();
function applyFilters() {
  const toolVal = toolFilterSelect.value;
  const minTok = Number(tokenSlider.value);
  tokenSliderLabel.textContent = String(minTok);
  dimSet = new Set();
  allNodesFlat.forEach(n => {
    const toolOk = toolVal === 'all' || n.tools === toolVal;
    const tokOk = (n.token_count || 0) >= minTok;
    if (!(toolOk && tokOk)) dimSet.add(n.id);
  });
  renderCanvas();
}
toolFilterSelect.addEventListener('change', applyFilters);
tokenSlider.addEventListener('input', applyFilters);

/* =========================================================
   15. 键盘导航
   ========================================================= */
treeWrap.addEventListener('keydown', (e) => {
  const node = byId.get(selectedId);
  if (!node) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const sibs = node.parentNode ? node.parentNode.children : [node];
    const idx = sibs.indexOf(node);
    const target = sibs[e.key === 'ArrowLeft' ? idx - 1 : idx + 1];
    if (target) selectNode(target);
    e.preventDefault();
  } else if (e.key === 'ArrowUp') {
    if (node.parentNode) selectNode(node.parentNode);
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (node.children && node.children.length) {
      collapsedIds.delete(node.id);
      selectNode(node.children.find(c => c.is_active_branch) || node.children[0]);
    }
    e.preventDefault();
  }
});

/* =========================================================
   16. 导出为 Markdown
   ========================================================= */
function exportPath(node) {
  if (!node) return;
  const chain = []; let cur = node;
  while (cur) { chain.unshift(cur); cur = cur.parentNode; }
  let md = `# 分支路径导出\n\n`;
  chain.forEach((n, i) => {
    md += `## ${i + 1}. ${n.question}\n\n**User:** ${n.question}\n\n**Agent:** ${n.answer}\n\n`;
    md += `> 首字 ${n.first_response_time ?? '-'}ms · 总耗时 ${n.total_response_time ? (n.total_response_time / 1000).toFixed(1) : '-'}s · ${n.token_count ?? '-'} tokens · ${n.create_time || '-'}\n\n---\n\n`;
  });
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `分支路径_${node.id}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById('bmToolbarExportBtn').addEventListener('click', () => exportPath(byId.get(selectedId)));

/* =========================================================
   17. 侧边栏：Tab 切换
   ========================================================= */
const TAB_NAMES = ['overview', 'detail', 'ranking', 'tools', 'timeline', 'tags', 'compare'];
document.querySelectorAll('.bm-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchSideTab(btn.dataset.tab));
});
function switchSideTab(name) {
  document.querySelectorAll('.bm-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  TAB_NAMES.forEach(t => document.getElementById('bmTabPanel_' + t).classList.toggle('active', t === name));
}

function renderSidePanels() {
  renderOverviewTab();
  renderDetailTab();
  renderRankingTab();
  renderToolsTab();
  renderTimelineTab();
  renderTagsTab();
  renderCompareTab();
}

/* ---- 概览 ---- */
function renderOverviewTab() {
  const box = document.getElementById('bmTabPanel_overview');
  const totalNodes = allNodesFlat.length;
  const branchPoints = allNodesFlat.filter(n => n.children && n.children.length > 1).length;
  const maxDepth = Math.max(...allNodesFlat.map(n => n.depth ?? 0));
  const totalTokens = allNodesFlat.reduce((s, n) => s + (n.token_count || 0), 0);
  const totalTime = allNodesFlat.reduce((s, n) => s + (n.total_response_time || 0), 0);
  box.innerHTML = `
    <div class="bm-stat-grid">
      <div class="bm-stat-card"><div class="bm-stat-num">${totalNodes}</div><div class="bm-stat-label">总节点数</div></div>
      <div class="bm-stat-card"><div class="bm-stat-num">${branchPoints}</div><div class="bm-stat-label">分叉点数</div></div>
      <div class="bm-stat-card"><div class="bm-stat-num">${maxDepth}</div><div class="bm-stat-label">最大深度</div></div>
      <div class="bm-stat-card"><div class="bm-stat-num">${totalTokens}</div><div class="bm-stat-label">总 Token</div></div>
      <div class="bm-stat-card" style="grid-column:span 2;"><div class="bm-stat-num">${(totalTime / 1000).toFixed(1)}s</div><div class="bm-stat-label">累计耗时</div></div>
    </div>
    <div class="bm-quick-actions">
      <button class="bm-mini-btn" id="bmOnlyMainBtn">仅展开主线</button>
      <button class="bm-mini-btn" id="bmExpandAllBtn">全部展开</button>
    </div>
  `;
  document.getElementById('bmOnlyMainBtn').addEventListener('click', () => {
    const mp = computeMainPathIds();
    allNodesFlat.forEach(n => { if (n.children && n.children.length && !mp.has(n.id)) collapsedIds.add(n.id); });
    renderAll();
  });
  document.getElementById('bmExpandAllBtn').addEventListener('click', () => { collapsedIds.clear(); renderAll(); });
}

/* ---- 详情 ---- */
function renderDetailTab() {
  const node = byId.get(selectedId);
  const box = document.getElementById('bmTabPanel_detail');
  if (!node) { box.innerHTML = '<div class="bm-empty">未选择节点</div>'; return; }
  const tags = tagsMap.get(node.id) || new Set();
  box.innerHTML = `
    <div class="bm-detail-title">
      <span class="bm-order-num">${node.branch_order ?? '-'}</span>
      <strong>${escapeHtml(aliasMap.get(node.id) || truncate(node.question, 28))}</strong>
      ${node.is_active_branch ? '<span class="bm-badge-active">★ 主线</span>' : ''}
    </div>
    <div class="bm-detail-msg"><strong>User:</strong> ${escapeHtml(node.question)}</div>
    <div class="bm-detail-msg"><strong>Agent:</strong> ${escapeHtml(node.answer)}</div>
    <div class="bm-detail-meta">
      ${node.tools ? `<span class="bm-meta-chip tool">🛠 ${escapeHtml(node.tools)}</span>` : ''}
      <span class="bm-meta-chip">⚡ ${node.first_response_time ?? '-'}ms</span>
      <span class="bm-meta-chip">⏱ ${node.total_response_time ? (node.total_response_time / 1000).toFixed(1) : '-'}s</span>
      <span class="bm-meta-chip">🔢 ${node.token_count ?? '-'} tokens</span>
      <span class="bm-meta-chip">🕒 ${node.create_time || '-'}</span>
    </div>
    ${node.reference ? `<div class="bm-detail-ref">🔗 ${escapeHtml(node.reference)}</div>` : ''}
    <div class="bm-field">
      <label>别名 / 备注</label>
      <input type="text" id="bmAliasInput" value="${escapeHtml(aliasMap.get(node.id) || '')}" placeholder="给这个分支起个好记的名字...">
    </div>
    <div class="bm-field">
      <label>标签</label>
      <div class="bm-tag-list">
        ${[...tags].map(t => `<span class="bm-tag-chip">${escapeHtml(t)}<button data-tag="${escapeHtml(t)}" class="bm-tag-remove">×</button></span>`).join('')}
      </div>
      <input type="text" id="bmTagInput" placeholder="新标签，回车添加">
    </div>
    <div class="bm-detail-actions">
      <button class="bm-mini-btn" id="bmSetA">加入对比 A</button>
      <button class="bm-mini-btn" id="bmSetB">加入对比 B</button>
      <button class="bm-mini-btn" id="bmCloneBtn">克隆问题</button>
      <button class="bm-mini-btn" id="bmExportBtn">导出路径</button>
    </div>
    <div class="bm-detail-actions">
      <button class="bm-mini-btn primary" id="bmJumpBtn">跳转到此分支对话</button>
    </div>
    <div class="bm-detail-actions">
      <button class="bm-mini-btn warn" id="bmArchiveBtn">归档此分支</button>
      <button class="bm-mini-btn danger" id="bmDeleteBtn">删除此分支</button>
    </div>
  `;

  document.getElementById('bmAliasInput').addEventListener('change', (e) => {
    if (e.target.value.trim()) aliasMap.set(node.id, e.target.value.trim()); else aliasMap.delete(node.id);
    renderAll();
  });
  document.getElementById('bmTagInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const v = e.target.value.trim();
      if (v) {
        if (!tagsMap.has(node.id)) tagsMap.set(node.id, new Set());
        tagsMap.get(node.id).add(v);
        renderAll();
      }
    }
  });
  box.querySelectorAll('.bm-tag-remove').forEach(btn => {
    btn.addEventListener('click', () => { tagsMap.get(node.id)?.delete(btn.dataset.tag); renderAll(); });
  });
  document.getElementById('bmSetA').addEventListener('click', () => { compareSlots.A = node.id; renderCompareTab(); switchSideTab('compare'); });
  document.getElementById('bmSetB').addEventListener('click', () => { compareSlots.B = node.id; renderCompareTab(); switchSideTab('compare'); });
  document.getElementById('bmCloneBtn').addEventListener('click', () => {
    navigator.clipboard?.writeText(node.question).catch(() => {});
    alert('已复制该分支的问题内容，可粘贴创建一个新的并排分支：\n\n' + node.question);
  });
  document.getElementById('bmExportBtn').addEventListener('click', () => exportPath(node));
  document.getElementById('bmJumpBtn').addEventListener('click', () => {
    alert('（演示）将跳转到手风琴视图中的该分支：\n' + node.question +
      '\n\n实际接入时这里应调用 onJumpToNode(node) 回调，定位到 BranchAccordionUI 对应节点。');
  });
  document.getElementById('bmArchiveBtn').addEventListener('click', () => {
    if (confirm('确认归档该分支及其所有子分支？（演示操作，不会真正修改数据）')) alert('（演示）已归档，请在实际系统中调用后端归档接口。');
  });
  document.getElementById('bmDeleteBtn').addEventListener('click', () => {
    if (confirm('确认永久删除该分支及其所有子分支？此操作不可恢复！（演示操作）')) alert('（演示）已删除，请在实际系统中调用后端删除接口并刷新树。');
  });
}

/* ---- 排行 ---- */
function renderRankingTab() {
  const box = document.getElementById('bmTabPanel_ranking');
  const sorted = [...allNodesFlat].sort((a, b) => (b.token_count || 0) - (a.token_count || 0)).slice(0, 10);
  box.innerHTML = sorted.map((n, i) => `
    <div class="bm-rank-row" data-id="${n.id}">
      <span class="bm-rank-idx">${i + 1}</span>
      <span class="bm-rank-text">${escapeHtml(truncate(aliasMap.get(n.id) || n.question, 22))}</span>
      <span class="bm-rank-value">${n.token_count || 0} tok</span>
    </div>`).join('');
  box.querySelectorAll('.bm-rank-row').forEach(row => {
    row.addEventListener('click', () => { const n = byId.get(Number(row.dataset.id)); if (n) selectNode(n); });
  });
}

/* ---- 工具统计 ---- */
function renderToolsTab() {
  const box = document.getElementById('bmTabPanel_tools');
  const counts = {};
  allNodesFlat.forEach(n => { if (n.tools) counts[n.tools] = (counts[n.tools] || 0) + 1; });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!entries.length) { box.innerHTML = '<div class="bm-empty">本次会话未调用任何工具</div>'; return; }
  const max = entries[0][1];
  box.innerHTML = entries.map(([name, count]) => `
    <div class="bm-bar-row">
      <span class="bm-bar-label">${escapeHtml(name)}</span>
      <div class="bm-bar-track"><div class="bm-bar-fill" style="width:${(count / max * 100).toFixed(0)}%"></div></div>
      <span class="bm-bar-value">${count}</span>
    </div>`).join('');
}

/* ---- 时间线 ---- */
function renderTimelineTab() {
  const box = document.getElementById('bmTabPanel_timeline');
  const sorted = [...allNodesFlat].sort((a, b) => new Date(a.create_time) - new Date(b.create_time));
  box.innerHTML = sorted.map(n => `
    <div class="bm-timeline-row" data-id="${n.id}">
      <div class="bm-timeline-dot"></div>
      <div class="bm-timeline-body">
        <div class="bm-timeline-time">${n.create_time}</div>
        <div class="bm-timeline-text">${escapeHtml(truncate(aliasMap.get(n.id) || n.question, 26))}</div>
      </div>
    </div>`).join('');
  box.querySelectorAll('.bm-timeline-row').forEach(row => {
    row.addEventListener('click', () => { const n = byId.get(Number(row.dataset.id)); if (n) selectNode(n); });
  });
}

/* ---- 标签总览 ---- */
function renderTagsTab() {
  const box = document.getElementById('bmTabPanel_tags');
  const byTag = new Map();
  tagsMap.forEach((tagSet, nodeId) => {
    tagSet.forEach(tag => { if (!byTag.has(tag)) byTag.set(tag, []); byTag.get(tag).push(nodeId); });
  });
  if (byTag.size === 0) { box.innerHTML = '<div class="bm-empty">还没有添加任何标签，可在"详情"标签页为分支打标签</div>'; return; }
  let html = '';
  byTag.forEach((ids, tag) => {
    html += `<div class="bm-tag-group">
      <div class="bm-tag-group-title">🏷 ${escapeHtml(tag)} (${ids.length})</div>
      <div class="bm-tag-group-list">
        ${ids.map(id => { const n = byId.get(id); return `<span class="bm-tag-node-chip" data-id="${id}">${escapeHtml(truncate(n?.question || '', 14))}</span>`; }).join('')}
      </div>
    </div>`;
  });
  box.innerHTML = html;
  box.querySelectorAll('.bm-tag-node-chip').forEach(chip => {
    chip.addEventListener('click', () => { const n = byId.get(Number(chip.dataset.id)); if (n) selectNode(n); });
  });
}

/* ---- 对比 ---- */
function renderCompareTab() {
  const box = document.getElementById('bmTabPanel_compare');
  const nodeA = compareSlots.A != null ? byId.get(compareSlots.A) : null;
  const nodeB = compareSlots.B != null ? byId.get(compareSlots.B) : null;
  function col(node, label) {
    if (!node) return `<div class="bm-compare-col bm-compare-empty">${label}：请在"详情"中点击"加入对比${label}"</div>`;
    return `<div class="bm-compare-col">
      <div class="bm-compare-label">对比 ${label}</div>
      <div class="bm-detail-msg small"><strong>User:</strong> ${escapeHtml(node.question)}</div>
      <div class="bm-detail-msg small"><strong>Agent:</strong> ${escapeHtml(node.answer)}</div>
      <div class="bm-detail-meta">
        <span class="bm-meta-chip">🔢 ${node.token_count ?? '-'} tok</span>
        <span class="bm-meta-chip">⏱ ${node.total_response_time ? (node.total_response_time / 1000).toFixed(1) : '-'}s</span>
      </div>
    </div>`;
  }
  box.innerHTML = `<div class="bm-compare-grid">${col(nodeA, 'A')}${col(nodeB, 'B')}</div>`;
}

/* =========================================================
   18. 初始化
   ========================================================= */
renderAll();
requestAnimationFrame(() => centerOnNode(root));

})();
</script>

</body>
</html>
