<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>数据驱动的 3D 分支树对话（支持新增并排分支）</title>
<style>
* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(circle at 50% 8%, #fff 0, #f4f6f9 35%, #e8edf3 100%);
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  margin: 0;
  color: #1e293b;
}
.chat-container { width: 100%; max-width: 900px; }

.msg {
  background: #fff;
  padding: 15px 19px;
  border-radius: 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  line-height: 1.6;
}
.msg:last-child { margin-bottom: 0; }

/* ===== 顶部工具条 ===== */
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0 20px;
}
.hint { font-size: 13px; color: #64748b; line-height: 1.6; }
.reset-btn {
  border: 1px solid #cbd5e1;
  background: #fff;
  color: #475569;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  cursor: pointer;
  transition: .2s;
  flex-shrink: 0;
}
.reset-btn:hover { background: #f1f5f9; color: #1e293b; }

/* ===== depth 0：顶层书本 ===== */
.branch-shell {
  display: grid;
  grid-template-columns: minmax(0,1fr) 52px;
  gap: 10px;
  align-items: start;
  margin: 22px 0;
}
.branch-shell.nested {
  display: block;
  margin: 18px 0 4px;
}

.branch-stage {
  position: relative;
  min-width: 0;
  display: grid;
  transform-style: preserve-3d;
  perspective: 1600px;   /* 关键修复：透视直接挂在每一层 stage 自己身上 */
  isolation: isolate;
  transition: height .5s cubic-bezier(.22,1,.36,1);
}

/* ===== 书页本体（任意深度共用） ===== */
.branch-page {
  grid-area: 1 / 1;
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  background: linear-gradient(90deg,#f1f5f9 0,#fff 18px,#fff 100%);
  border-radius: 4px 12px 12px 4px;
  border: 1px solid #e2e8f0;
  border-left: 6px solid #cbd5e1;
  box-shadow: 7px 9px 22px rgba(15,23,42,.10);
  transform-origin: left center;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  transition: transform .68s cubic-bezier(.22,1,.36,1), filter .35s, box-shadow .35s;
}
.branch-page.sub {
  border-left-width: 4px;
  border-radius: 3px 10px 10px 3px;
  box-shadow: 5px 7px 16px rgba(15,23,42,.08);
}
.branch-page.active { z-index: 30; transform: translateZ(30px); box-shadow: 10px 16px 30px rgba(15,23,42,.14); }
.branch-page.after {
  z-index: calc(20 - var(--d));
  transform: translateX(calc(var(--d)*6px)) translateY(calc(var(--d)*2px)) translateZ(calc(var(--d)*-14px)) rotateY(calc(var(--d)*-1deg));
  filter: brightness(calc(1 - var(--d)*.035));
}
.branch-page.before {
  z-index: calc(10 - var(--d));
  transform: translateX(-8px) translateZ(calc(-16px*var(--d))) rotateY(-156deg);
  filter: brightness(.94);
  pointer-events: none;
}
.branch-page:not(.active) .branch-page-content { pointer-events: none; }
.branch-page-content { padding: 22px; backface-visibility: hidden; }
.branch-page.sub .branch-page-content { padding: 16px; }

/* ===== 标题行 / 徽章 ===== */
.branch-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.branch-order-num {
  width: 24px; height: 24px; flex-shrink: 0;
  display: inline-grid; place-items: center;
  border-radius: 50%; background: #e2e8f0; color: #475569; font-size: 12px; font-weight: 700;
}
.active-badge { background: #10b981; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.new-badge { background: #6366f1; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.draft-badge { background: #f59e0b; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }

/* ===== meta 信息条 ===== */
.meta-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; font-size: 12px; color: #64748b; }
.meta-item { background: #f1f5f9; padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.meta-item.tool { background: #eef2ff; color: #4338ca; }

/* ===== 引用块 ===== */
.reference-block {
  margin-top: 10px; font-size: 12.5px; color: #475569;
  background: #f8fafc; border-left: 3px solid #94a3b8;
  padding: 8px 12px; border-radius: 0 8px 8px 0;
}

/* ===== 新增并排分支：按钮 + 说明 ===== */
.add-sibling-btn {
  margin-top: 12px;
  width: 100%;
  background: #f8fafc;
  border: 1px dashed #cbd5e1;
  color: #475569;
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: .2s;
}
.add-sibling-btn:hover { background: #f1f5f9; border-color: #94a3b8; color: #1e293b; }
.mini-hint { font-size: 11.5px; color: #94a3b8; margin-top: 5px; text-align: center; }

/* ===== 草稿分支：编辑态 ===== */
.draft-tip { font-size: 12.5px; color: #64748b; margin-bottom: 10px; line-height: 1.55; }
.draft-input {
  width: 100%; min-height: 84px; resize: vertical;
  border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px;
  font-size: 14px; font-family: inherit; color: #1e293b;
  transition: border-color .2s;
}
.draft-input:focus { outline: none; border-color: #3b82f6; }
.draft-btn-row { display: flex; gap: 8px; margin-top: 10px; }
.send-btn {
  flex: 1; background: #3b82f6; color: #fff; border: 0;
  padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13.5px;
  transition: background .2s;
}
.send-btn:hover { background: #2563eb; }
.cancel-btn {
  background: #fff; border: 1px solid #cbd5e1; color: #64748b;
  padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13.5px;
  transition: .2s;
}
.cancel-btn:hover { background: #f1f5f9; }

/* ===== 嵌套区域容器 ===== */
.nested-wrap {
  margin-top: 16px; padding-top: 14px; padding-left: 14px;
  border-top: 1px dashed #cbd5e1;
  border-left: 3px solid var(--depth-color, #cbd5e1);
}
.nested-label { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: #64748b; margin-bottom: 10px; }

/* ===== depth0 竖排书签 ===== */
.rail-tabs { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.rail-tab {
  border: 0; background: #94a3b8; color: #fff;
  padding: 10px 7px; min-height: 90px;
  border-radius: 0 8px 8px 0;
  writing-mode: vertical-rl;
  font-weight: 600; font-size: 12px; cursor: pointer;
  box-shadow: 3px 3px 8px rgba(0,0,0,.08);
  transition: transform .25s, background .25s;
}
.rail-tab:hover { background: #64748b; transform: translateX(-3px); }
.rail-tab.current { background: #3b82f6; transform: translateX(-6px); }
.rail-tab.draft-tab { background: #f59e0b; }
.rail-tab.add-tab { background: transparent; border: 1px dashed #94a3b8; color: #64748b; box-shadow: none; }
.rail-tab.add-tab:hover { background: #f1f5f9; }

/* ===== depth>=1 横排药丸标签 ===== */
.pill-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
.pill-tab {
  border: 1px solid #cbd5e1; background: #fff; color: #64748b;
  padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer;
  transition: .2s;
}
.pill-tab:hover { background: #f1f5f9; }
.pill-tab.current { background: #475569; color: #fff; border-color: #475569; }
.pill-tab.draft-tab { border-color: #f59e0b; color: #b45309; }
.pill-tab.add-tab { background: transparent; border: 1px dashed #94a3b8; }
.pill-tab.add-tab:hover { background: #f1f5f9; }

@media (max-width: 640px) {
  .branch-shell { grid-template-columns: minmax(0,1fr) 38px; }
  .branch-page-content { padding: 16px; }
}
</style>
</head>
<body>

<div class="chat-container" id="app">
  <div class="toolbar">
    <span class="hint">
      📖 切换标签 = 查看不同的并排分支；点击「➕ 新增并排分支」会在<b>同一层级</b>新增一条独立对话，
      互不覆盖、可随时来回切换。
    </span>
    <button class="reset-btn" id="resetToMain">🧭 回到主线分支</button>
  </div>

  <div id="root"></div>
</div>

<script>
(function () {

/* =========================================================
   1. 模拟你的数据库表：一行 = 一条 Q&A 节点
   ========================================================= */
const records = [
  { id:1, session_id:'s1', parent_id:null, branch_order:1, is_active_branch:1,
    question:'我们需要验证多任务学习框架下的 Loss 权重稳定性。',
    answer:'这是一个关键的验证点。对于联合预测模型，我建议了三种评估实验设计，你可以逐个查看，也可以随时新增并排的分支继续探索其他方向。',
    tools:null, first_response_time:410, total_response_time:1380, token_count:96,
    create_time:'2024-05-02 10:00:00', update_time:'2024-05-02 10:00:01', reference:null },

  { id:2, session_id:'s1', parent_id:1, branch_order:1, is_active_branch:1,
    question:'先试试单变量敏感性扫描 (OAT)。',
    answer:'好的，我们可以固定次要任务的 Loss，在 [0.1, 1.0] 区间内调整主要任务权重，直观看出单一维度的变化趋势。这个方向下面还能细分两种扫描策略。',
    tools:'code_interpreter', first_response_time:520, total_response_time:1890, token_count:142,
    create_time:'2024-05-02 10:01:10', update_time:'2024-05-02 10:01:12', reference:null },

  { id:3, session_id:'s1', parent_id:1, branch_order:2, is_active_branch:0,
    question:'如果用 L9 正交设计实验呢？',
    answer:'这是更系统的方法：设置 3 个关键因子的 3 个水平，用 9 组超参数实验就能评估多任务权重的交互影响。',
    tools:null, first_response_time:390, total_response_time:1510, token_count:118,
    create_time:'2024-05-02 10:01:40', update_time:'2024-05-02 10:01:42', reference:null },

  { id:4, session_id:'s1', parent_id:1, branch_order:3, is_active_branch:0,
    question:'能否在训练中自动调整权重？',
    answer:'可以引入不确定性加权 (Uncertainty Weighting) 或梯度归一化 (GradNorm)，减少 Appendix 中的消融实验工作量。',
    tools:null, first_response_time:455, total_response_time:1720, token_count:131,
    create_time:'2024-05-02 10:02:05', update_time:'2024-05-02 10:02:07', reference:'GradNorm, arXiv:1711.02257' },

  { id:5, session_id:'s1', parent_id:2, branch_order:1, is_active_branch:1,
    question:'用线性步长会不会太粗？',
    answer:'0.1 的线性步长可覆盖 9 个采样点，适合先做粗筛，后续可在敏感区间内细化。',
    tools:'python_sandbox', first_response_time:610, total_response_time:2100, token_count:88,
    create_time:'2024-05-02 10:03:00', update_time:'2024-05-02 10:03:02', reference:null },

  { id:6, session_id:'s1', parent_id:2, branch_order:2, is_active_branch:0,
    question:'如果权重的量级跨度很大，对数步长是不是更合适？',
    answer:'是的，当权重跨越多个数量级时，对数步长能更均匀地采样每个数量级区间。',
    tools:null, first_response_time:365, total_response_time:1290, token_count:76,
    create_time:'2024-05-02 10:03:30', update_time:'2024-05-02 10:03:31', reference:null },

  { id:7, session_id:'s1', parent_id:3, branch_order:1, is_active_branch:1,
    question:'直接套用标准正交表就行吗？',
    answer:'对于 3 因子 3 水平的情况，标准 L9(3^4) 表可以直接使用，且能保证主效应完全解耦。',
    tools:null, first_response_time:300, total_response_time:1100, token_count:64,
    create_time:'2024-05-02 10:04:00', update_time:'2024-05-02 10:04:01', reference:null },

  { id:8, session_id:'s1', parent_id:3, branch_order:2, is_active_branch:0,
    question:'权重之间可能存在耦合，要不要分析交互项？',
    answer:'可以升级到 L18 或引入方差分析（ANOVA）评估交互效应，但实验组数会增加。',
    tools:null, first_response_time:410, total_response_time:1600, token_count:102,
    create_time:'2024-05-02 10:04:20', update_time:'2024-05-02 10:04:22', reference:null },

  { id:9, session_id:'s1', parent_id:4, branch_order:1, is_active_branch:1,
    question:'不确定性加权的实现成本高吗？',
    answer:'成本较低，只需为每个任务引入一个可学习的对数方差参数，训练中自动学习权重。',
    tools:null, first_response_time:295, total_response_time:980, token_count:58,
    create_time:'2024-05-02 10:05:00', update_time:'2024-05-02 10:05:01', reference:null },

  { id:10, session_id:'s1', parent_id:4, branch_order:2, is_active_branch:0,
    question:'GradNorm 会不会增加训练开销？',
    answer:'会有小幅额外开销（需要额外反传一次梯度范数），但能显式平衡任务梯度量级，适合任务数较多的场景。',
    tools:null, first_response_time:330, total_response_time:1230, token_count:80,
    create_time:'2024-05-02 10:05:20', update_time:'2024-05-02 10:05:22', reference:null },
];

const CURRENT_SESSION = 's1';
const INITIAL_MAX_ID = Math.max(...records.map(r => r.id));
let idCounter = INITIAL_MAX_ID;
function nextId() { return ++idCounter; }

function nowString() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
         pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function mockReply(question) {
  return '（自动模拟回复）针对“' + question + '”，可以在该并排分支中继续深入讨论，具体结论建议结合后续实验数据进一步验证。';
}

function truncate(text, n) { return text.length > n ? text.slice(0, n) + '…' : text; }

/* =========================================================
   2. 拉平数组 -> 树
   ========================================================= */
function buildTree(rows) {
  const byId = new Map();
  rows.forEach(r => byId.set(r.id, { ...r, children: [] }));
  let root = null;
  byId.forEach(node => {
    if (node.parent_id === null || node.parent_id === undefined) {
      root = node;
    } else {
      const parent = byId.get(node.parent_id);
      if (parent) { node.parentNode = parent; parent.children.push(node); }
    }
  });
  byId.forEach(node => node.children.sort((a, b) => a.branch_order - b.branch_order));
  return root;
}

const tree = buildTree(records.filter(r => r.session_id === CURRENT_SESSION));

const DEPTH_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ef4444'];
const resetFns = []; // 每一层书本的“回到主线”函数

/* =========================================================
   3. 递归创建一层“书本”：siblings 是同一个 parent_id 下的节点数组
   ========================================================= */
function createBranchBook(siblings, depth, notifyParentHeight) {
  const isTop = depth === 0;

  const shell = document.createElement('div');
  shell.className = 'branch-shell' + (isTop ? '' : ' nested');

  const stage = document.createElement('div');
  stage.className = 'branch-stage';

  const tabsWrap = document.createElement(isTop ? 'nav' : 'div');
  tabsWrap.className = isTop ? 'rail-tabs' : 'pill-tabs';

  if (isTop) { shell.appendChild(stage); shell.appendChild(tabsWrap); }
  else { shell.appendChild(tabsWrap); shell.appendChild(stage); }

  let current = 0;
  const pageEls = [];
  const tabEls = [];

  function updateHeight() {
    requestAnimationFrame(() => {
      if (!pageEls[current]) return;
      stage.style.height = pageEls[current].offsetHeight + 'px';
      if (notifyParentHeight) notifyParentHeight();
    });
  }

  function layout() {
    pageEls.forEach((page, i) => {
      page.classList.remove('active', 'before', 'after');
      if (i === current) page.classList.add('active');
      else if (i < current) { page.classList.add('before'); page.style.setProperty('--d', current - i); }
      else { page.classList.add('after'); page.style.setProperty('--d', i - current); }
    });
    tabEls.forEach((tab, i) => tab.classList.toggle('current', i === current));
    updateHeight();
  }

  function resetToActive() {
    const idx = siblings.findIndex(n => n.is_active_branch);
    current = idx === -1 ? 0 : idx;
    layout();
  }
  resetFns.push(resetToActive);

  const ro = new ResizeObserver(updateHeight);

  /* ---------- 正常内容渲染 ---------- */
  function renderNormalContent(node, content) {
    const titleRow = document.createElement('div');
    titleRow.className = 'branch-title-row';
    titleRow.innerHTML =
      '<span class="branch-order-num">' + node.branch_order + '</span>' +
      '<strong>' + truncate(node.question, 26) + '</strong>' +
      (node.is_active_branch ? '<span class="active-badge">★ 主线</span>' : '') +
      (node.id > INITIAL_MAX_ID ? '<span class="new-badge">新增分支</span>' : '');
    content.appendChild(titleRow);

    const qMsg = document.createElement('div');
    qMsg.className = 'msg';
    qMsg.innerHTML = '<strong>User:</strong> ' + node.question;
    content.appendChild(qMsg);

    const aMsg = document.createElement('div');
    aMsg.className = 'msg';
    aMsg.innerHTML = '<strong>Agent:</strong> ' + node.answer;
    content.appendChild(aMsg);

    const meta = document.createElement('div');
    meta.className = 'meta-bar';
    if (node.tools) meta.innerHTML += '<span class="meta-item tool">🛠 ' + node.tools + '</span>';
    meta.innerHTML +=
      '<span class="meta-item">⚡ 首字 ' + node.first_response_time + 'ms</span>' +
      '<span class="meta-item">⏱ 总耗时 ' + (node.total_response_time / 1000).toFixed(1) + 's</span>' +
      '<span class="meta-item">🔢 ' + node.token_count + ' tokens</span>' +
      '<span class="meta-item">🕒 ' + node.create_time + '</span>';
    content.appendChild(meta);

    if (node.reference) {
      const ref = document.createElement('div');
      ref.className = 'reference-block';
      ref.innerHTML = '🔗 参考：' + node.reference;
      content.appendChild(ref);
    }

    if (node.children && node.children.length > 0) {
      const nestedWrap = document.createElement('div');
      nestedWrap.className = 'nested-wrap';
      nestedWrap.style.setProperty('--depth-color', DEPTH_COLORS[depth % DEPTH_COLORS.length]);

      const label = document.createElement('div');
      label.className = 'nested-label';
      label.innerHTML = '<span>↳ 该分支下有 ' + node.children.length + ' 个子分支</span><span>可继续切换 / 追加</span>';
      nestedWrap.appendChild(label);

      const childBook = createBranchBook(node.children, depth + 1, updateHeight);
      nestedWrap.appendChild(childBook.element);

      content.appendChild(nestedWrap);
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'add-sibling-btn';
    addBtn.textContent = '➕ 新增并排分支';
    addBtn.addEventListener('click', addBranch);
    content.appendChild(addBtn);

    const miniHint = document.createElement('div');
    miniHint.className = 'mini-hint';
    miniHint.textContent = '将在与当前节点相同的层级下新增一条独立对话，不影响其它分支';
    content.appendChild(miniHint);
  }

  /* ---------- 草稿（新增分支待填写）渲染 ---------- */
  function renderDraftContent(node, content, page, refreshTabLabel, refreshContent) {
    const row = document.createElement('div');
    row.className = 'branch-title-row';
    row.innerHTML =
      '<span class="branch-order-num">' + node.branch_order + '</span>' +
      '<strong>新的并排分支</strong><span class="draft-badge">待发送</span>';
    content.appendChild(row);

    const tip = document.createElement('div');
    tip.className = 'draft-tip';
    tip.textContent = '这是与当前节点并排的新对话（同一层级），输入问题后会独立生成回答，不影响其它分支。';
    content.appendChild(tip);

    const textarea = document.createElement('textarea');
    textarea.className = 'draft-input';
    textarea.placeholder = '例如：如果换一种正则化方式会怎样？';
    content.appendChild(textarea);

    const btnRow = document.createElement('div');
    btnRow.className = 'draft-btn-row';

    const sendBtn = document.createElement('button');
    sendBtn.className = 'send-btn';
    sendBtn.textContent = '发送，生成该分支';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel-btn';
    cancelBtn.textContent = '取消';

    sendBtn.addEventListener('click', () => {
      const val = textarea.value.trim();
      if (!val) { textarea.focus(); return; }
      node.question = val;
      node.answer = mockReply(val);
      node.first_response_time = 280 + Math.floor(Math.random() * 260);
      node.total_response_time = node.first_response_time + 700 + Math.floor(Math.random() * 700);
      node.token_count = 40 + Math.floor(val.length * 1.6);
      node.create_time = nowString();
      node.update_time = node.create_time;
      node.draft = false;

      refreshTabLabel();
      refreshContent();
      updateHeight();
    });

    cancelBtn.addEventListener('click', () => {
      const sIdx = siblings.indexOf(node);
      if (sIdx > -1) siblings.splice(sIdx, 1);
      const pIdx = pageEls.indexOf(page);
      if (pIdx > -1) {
        pageEls.splice(pIdx, 1);
        const [removedTab] = tabEls.splice(pIdx, 1);
        if (removedTab) removedTab.remove();
      }
      page.remove();
      current = Math.max(0, siblings.length - 1);
      layout();
    });

    btnRow.appendChild(sendBtn);
    btnRow.appendChild(cancelBtn);
    content.appendChild(btnRow);

    requestAnimationFrame(() => textarea.focus());
  }

  /* ---------- 构建一个节点对应的 页面 + 标签 ---------- */
  function buildOne(node) {
    const page = document.createElement('article');
    page.className = 'branch-page' + (isTop ? '' : ' sub');
    page.dataset.id = node.id;

    const content = document.createElement('div');
    content.className = 'branch-page-content';
    page.appendChild(content);

    stage.appendChild(page);
    pageEls.push(page);
    ro.observe(page);

    const tab = document.createElement('button');
    tab.className = isTop ? 'rail-tab' : 'pill-tab';
    tab.addEventListener('click', () => {
      const idx = pageEls.indexOf(page);
      if (idx !== -1 && idx !== current) { current = idx; layout(); }
    });
    tabsWrap.appendChild(tab);
    tabEls.push(tab);

    function refreshTabLabel() {
      tab.classList.toggle('draft-tab', !!node.draft);
      tab.textContent = node.draft
        ? '分支 ' + node.branch_order + '（待填写）'
        : (isTop ? '分支 ' + node.branch_order + '：' : '') + truncate(node.question, isTop ? 14 : 12);
    }
    refreshTabLabel();

    function refreshContent() {
      content.innerHTML = '';
      if (node.draft) renderDraftContent(node, content, page, refreshTabLabel, refreshContent);
      else renderNormalContent(node, content);
    }
    refreshContent();
  }

  siblings.forEach(buildOne);

  /* ---------- “+ 新增分支” 快捷标签（始终保持在标签列表最后） ---------- */
  const addTab = document.createElement('button');
  addTab.className = (isTop ? 'rail-tab' : 'pill-tab') + ' add-tab';
  addTab.textContent = isTop ? '＋ 新增分支' : '＋ 新增';
  tabsWrap.appendChild(addTab);

  function addBranch() {
    const parentId = siblings.length ? siblings[0].parent_id : null;
    const sessionId = siblings.length ? siblings[0].session_id : CURRENT_SESSION;
    const maxOrder = siblings.reduce((m, s) => Math.max(m, s.branch_order), 0);

    const draftNode = {
      id: nextId(),
      session_id: sessionId,
      parent_id: parentId,
      branch_order: maxOrder + 1,
      is_active_branch: 0,
      question: '', answer: '', tools: null,
      first_response_time: null, total_response_time: null, token_count: null,
      create_time: nowString(), update_time: nowString(), reference: null,
      children: [], draft: true,
    };

    siblings.push(draftNode);
    buildOne(draftNode);
    tabsWrap.appendChild(addTab); // 保证“+”始终排在最后
    current = pageEls.length - 1;
    layout();
  }
  addTab.addEventListener('click', addBranch);

  layout();

  return { element: shell, updateHeight };
}

/* =========================================================
   4. 渲染根节点（普通消息气泡）+ 挂载第一层书本
   ========================================================= */
const rootEl = document.getElementById('root');

if (tree) {
  const rootQ = document.createElement('div');
  rootQ.className = 'msg';
  rootQ.innerHTML = '<strong>User:</strong> ' + tree.question;
  rootEl.appendChild(rootQ);

  const rootA = document.createElement('div');
  rootA.className = 'msg';
  rootA.innerHTML = '<strong>Agent:</strong> ' + tree.answer;
  rootEl.appendChild(rootA);

  if (tree.children && tree.children.length > 0) {
    const topBook = createBranchBook(tree.children, 0, null);
    rootEl.appendChild(topBook.element);
  }
}

document.getElementById('resetToMain').addEventListener('click', () => {
  resetFns.forEach(fn => fn());
});

})();
</script>
